[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-home-cli"
version = "0.1.0"
description = "Read-only Xiaomi Cloud device and local token discovery for Linux terminals"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES/*.txt"]
dependencies = ["requests>=2.32.5,<3", "pycryptodome>=3.23,<4", "qrcode>=8.2,<9"]

[project.scripts]
mi-home-cli = "mi_home_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1", "bandit>=1.8,<2", "pip-audit>=2.9,<3", "build>=1.3,<2"]

[project.urls]
Repository = "https://github.com/fstackdev/mi-home-cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
