name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=mi_home_cli --cov-report=term-missing
      - run: python -m build
      - run: mi-home-cli --help
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: bandit -q -r src
      - run: pip-audit
      - name: Scan tracked files for credentials
        run: |
          detect-secrets scan --no-verify > "$RUNNER_TEMP/mi-home-secrets.json"
          python -c 'import json, os, sys; data=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "mi-home-secrets.json"))); hits=data["results"]; print("Secret scan:", "clean" if not hits else "unexpected potential credentials in " + ", ".join(hits)); sys.exit(bool(hits))'
